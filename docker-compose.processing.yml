# A completely separate, on-demand Compose project: no published ports,
# no proxy network, no always-running workers.
name: ruslex-processing
x-processing: &processing
  image: ruslex-processing:local
  build:
    context: .
    dockerfile: Dockerfile.processing
  user: "${PUID}:${PGID}"
  working_dir: /app
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs:
    - /tmp:rw,nosuid,size=128m
  volumes:
    - "${DATA_ROOT}/processing:/work"
    - "${DATA_ROOT}/ocr:/ocr:ro"
    - "${DATA_ROOT}/processing/state:/state"
services:
  worker:
    <<: *processing
    volumes:
      - "${DATA_ROOT}/processing:/work"
      - "${DATA_ROOT}/ocr:/ocr:ro"
      - "${DATA_ROOT}/reference:/reference:ro"
      - "${DATA_ROOT}/lexicon:/live:ro"
      - "${DATA_ROOT}/backups:/backups:ro"
      - "${DATA_ROOT}/processing/state:/state"
  rehearsal:
    <<: *processing
    # Disposable stress tests: no network, no AI credentials, no live writes.
    network_mode: none
    volumes:
      - "${DATA_ROOT}/processing:/work"
      - "${DATA_ROOT}/reference:/reference:ro"
      - "${DATA_ROOT}/lexicon:/live:ro"
      - "${DATA_ROOT}/backups:/backups:ro"

  promoter:
    <<: *processing
    # No network or model credentials during the only operation writing live.
    network_mode: none
    volumes:
      - "${DATA_ROOT}/processing:/work"
      - "${DATA_ROOT}/ocr:/ocr:ro"
      - "${DATA_ROOT}/reference:/reference:ro"
      - "${DATA_ROOT}/lexicon:/live"
      - "${DATA_ROOT}/backups:/backups"

  state-init:
    # Run only when OpenCode state needs initialization or repair.
    # Root can repair the processing directory and private OpenCode state only.
    image: ruslex-processing:local
    build:
      context: .
      dockerfile: Dockerfile.processing
    user: "0:0"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    volumes:
      - "${DATA_ROOT}/processing:/processing"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        set -eu
        umask 077
        mkdir -p /processing/state/config /processing/state/data /processing/state/cache
        chown "${PUID}:${PGID}" /processing
        chmod 750 /processing
        chown -R "${PUID}:${PGID}" /processing/state
        chmod 700 /processing/state /processing/state/config /processing/state/data /processing/state/cache
        touch /processing/state/.ruslex-ready-${PUID}
        chown "${PUID}:${PGID}" /processing/state/.ruslex-ready-${PUID}
