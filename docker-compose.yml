name: ruslex
services:
  web:
    build: .
    image: ruslex:local
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    env_file: .env
    environment:
      DATA_DIR: /data
    ports:
      - "127.0.0.1:8790:8000"
    # The web app only needs the two writable databases. Never mount OCR,
    # OpenRussian, backups or processing/state (which holds AI credentials).
    volumes:
      - "${DATA_ROOT}/lexicon:/data/lexicon"
      - "${DATA_ROOT}/admin:/data/admin"
    networks:
      default: {}
      proxy:
        aliases:
          - ruslex-web
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      options:
        max-size: 10m
        max-file: "3"
networks:
  proxy:
    external: true
