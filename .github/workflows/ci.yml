name: Ruslex checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Executable launcher permissions
        run: test -x manage.sh && test -x process.sh && test -x deploy.sh && test -x scripts/entrypoint.sh
      - name: Python offline regression tests
        run: python scripts/offline_checks.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund;
          else npm install --no-audit --no-fund; fi
      - name: Svelte type checks
        working-directory: frontend
        run: npm run check
      - name: Frontend regression tests
        working-directory: frontend
        run: npm test
      - name: Frontend build
        working-directory: frontend
        run: npm run build

  django-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Django runtime
        run: pip install -r backend/requirements.txt
      - name: Exercise complete Django API on a synthetic database
        env:
          PYTHONPATH: .:backend
        run: python scripts/ci_smoke_fixture.py
