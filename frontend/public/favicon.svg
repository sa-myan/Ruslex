<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 500 520" role="img" aria-labelledby="title desc">
<title id="title">Russian Lexicon — Я, indexed pages and an open book</title>
<desc id="desc">Ivory Cyrillic Ya in front of two pale index pages, rising from a curved ivory and coral-red open book on a midnight-blue rounded square.</desc>
<defs>
<linearGradient id="navy" x1="0" y1="0" x2=".75" y2="1"><stop offset="0" stop-color="#24537C"/><stop offset=".45" stop-color="#153757"/><stop offset="1" stop-color="#0C2643"/></linearGradient>
<linearGradient id="paper" x1="0" y1="0" x2="1" y2=".8"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#F8F5F0"/></linearGradient>
<linearGradient id="backPage" x1="0" y1="0" x2="1" y2=".8"><stop stop-color="#F0F7FF"/><stop offset="1" stop-color="#9BBCEC"/></linearGradient>
<linearGradient id="red" x1="0" y1="0" x2="1" y2=".3"><stop stop-color="#FE4B48"/><stop offset=".5" stop-color="#EB2D33"/><stop offset="1" stop-color="#F34244"/></linearGradient>
</defs>
<!-- Contrasting navy tile -->
<rect x="11.5" y="18.5" width="477" height="498" rx="127" fill="url(#navy)"/>
<rect x="12.35" y="19.35" width="475.3" height="496.3" rx="126.2" fill="none" stroke="#8CBDEA" stroke-opacity=".85" stroke-width="10"/>
